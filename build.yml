name: construir
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo 'Configure o secret GOOGLE_SERVICES_JSON em Settings > Secrets and variables > Actions'; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Nosso-Cantinho-debug
          path: app/build/outputs/apk/debug/app-debug.apk
